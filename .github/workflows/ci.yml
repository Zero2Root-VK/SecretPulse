name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            os: ubuntu-22.04
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.10'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Verify generated bundle is current
        run: python build_secretpulse.py --check
      - name: Compile standalone bundle
        run: python -m py_compile SecretPulse.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Enforce detection quality
        run: >-
          python benchmarks/run_benchmark.py
          --min-precision 1.0
          --min-recall 1.0
          --min-line-accuracy 1.0
          --min-category-accuracy 1.0
          --min-severity-accuracy 1.0
          --max-clean-noise 0
