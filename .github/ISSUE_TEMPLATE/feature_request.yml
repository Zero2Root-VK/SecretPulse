name: Feature request
description: Propose a detection, workflow, or reporting improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or detection gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected interface and evidence quality.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing flags, provider APIs, or tools you evaluated.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This request is for authorized security testing.
          required: true
        - label: This request does not require destructive or write-capable target actions.
          required: true
